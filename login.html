<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SuperMarket: productos frescos y buenos precios.">
  <title>Iniciar sesión | SuperMarket</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

<header class="site-header">
  <a class="logo" href="index.html">🛒 Super<span>Market</span></a>
  <nav class="nav" aria-label="Navegación principal">
    <a href="index.html" >Inicio</a>
    <a href="productos.html" >Productos</a>
    <a href="carrito.html" >Carrito</a>
    <a href="contacto.html" >Contacto</a>
  </nav>
  <div class="header-actions">
    <a class="btn btn-yellow" href="login.html">Iniciar sesión</a>
    <a class="btn btn-primary" href="carrito.html">🛒 Mi compra</a>
  </div>
</header>


<main>
  <section class="page-heading"><h1>Bienvenido a SuperMarket</h1><p>Ingresa a tu cuenta para continuar.</p></section>
  <section class="form-card">
    <h2>Iniciar sesión</h2>
    <form action="#" method="get">
      <div class="field"><label for="email">Correo electrónico</label><input id="email" name="email" type="email" placeholder="ejemplo@correo.com" autocomplete="email" required></div>
      <div class="field"><label for="password">Contraseña</label><input id="password" name="password" type="password" minlength="6" placeholder="Mínimo 6 caracteres" autocomplete="current-password" required></div>
      <button type="submit">Ingresar</button>
    </form>
    
    <p class="mt-12">¿No tienes cuenta? <a href="contacto.html">Contáctanos</a>.</p>
  </section>
</main>

<footer class="site-footer">
  <p><strong>🛒 SuperMarket</strong></p>
  <p>Calidad, frescura y buenos precios.</p>
  <p>Contacto: contacto@supermarket.com</p>
  <p>© 2026 SuperMarket.</p>
</footer>
</body>
</html>
